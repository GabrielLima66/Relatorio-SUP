services:
  dashboard-sup:
    build: .
    container_name: dashboard-sup
    restart: unless-stopped
    volumes:
      # repo inteiro montado dentro do container — código, .env, dashboard.db e
      # qualitor_session.json continuam exatamente onde já estão (backend/),
      # sem precisar mudar path nenhum no código.
      - .:/app
    working_dir: /app/backend
    networks:
      vlan_sede:
        ipv4_address: 172.30.8.51

networks:
  vlan_sede:
    external: true
